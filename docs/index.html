<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TextShield AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0b0d12;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .loader-container {
            text-align: center;
            max-width: 520px;
            padding: 30px;
        }

        .shield {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.4rem;
            margin: 0 0 8px;
        }

        .subtitle {
            color: #aeb4c2;
            font-size: 1rem;
            margin-bottom: 35px;
        }

        .spinner {
            width: 42px;
            height: 42px;

            margin: 0 auto 25px;

            border: 4px solid #292e3a;
            border-top: 4px solid #8b5cf6;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .loading-text {
            color: #8f96a5;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .privacy {
            margin-top: 30px;
            color: #a78bfa;
            font-size: 0.82rem;
        }
    </style>
</head>

<body>

    <div class="loader-container">

        <div class="shield">🛡️</div>

        <h1>TextShield AI</h1>

        <div class="subtitle">
            Privacy-Aware Intelligent Text Analysis
        </div>

        <div class="spinner"></div>

        <div class="loading-title">
            Starting TextShield AI...
        </div>

        <div class="loading-text">
            The demo is starting on the cloud.<br>
            First-time loading may take a little longer.
            Please wait a moment.
        </div>

           <div class="privacy">
        🔒 Privacy-First AI Pipeline
    </div>

    </div>

    <script>
        const azureApp =
            "https://textshield-ai.lemontree-cb7ad68d.eastus.azurecontainerapps.io";

        let attempts = 0;
        const maxAttempts = 60;

        async function checkAzureApp() {

            try {

                await fetch(azureApp, {
                    mode: "no-cors",
                    cache: "no-store"
                });

                window.location.href = azureApp;
                return;

            } catch (error) {

                attempts++;

                if (attempts < maxAttempts) {
                    setTimeout(checkAzureApp, 2000);
                }
            }
        }

        checkAzureApp();
    </script>

</body>
</html>
